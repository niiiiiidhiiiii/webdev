    <script>
      let r = Math.random();
      let first, second, third;

        first = "Crazy";
      } else if (r < 0.66 && r > 0.33) {
        first = "Damnyy";
      } else {
        first = "Whimsy";
      }

      r = Math.random();
      if (r < 0.33) {
        second = "mummyyy";
      } else if (r < 0.66 && r > 0.33) {
        second = "sunshine";
      } else {
        second = "coco";
      }

      r = Math.random();

        third = "goosp";
      } else if (r < 0.66 && r > 0.33) {
